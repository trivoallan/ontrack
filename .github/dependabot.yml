version: 2
updates:
  # Actions are pinned by commit SHA (ADR-0011); this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  # npm: security updates only (the limit of 0 turns version updates off).
  # The entry exists for its title: Dependabot's default, `chore(deps-dev):
  # Bump …`, uses a scope ADR-0006 does not hold.
  - package-ecosystem: npm
    directories: ["/", "/site"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
