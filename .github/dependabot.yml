version: 2
updates:
  # Actions are pinned by commit SHA (ADR-0011); this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # ADR-0018 rule 2: no update is proposed before its release is 3 days old.
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
  # npm at the root: version updates for the engineering track only, security
  # updates for everything. A question governance revises must reach this
  # repository as soon as it is released, so its bump comes as a pull request.
  # `allow` would also filter security updates, so the other direct
  # dependencies are ignored by update type instead, which only affects
  # version updates.
  # ponytail: a new direct dependency gets version updates until it is added
  # to `ignore` below.
  # The entry also exists for its title: Dependabot's default,
  # `chore(deps-dev): Bump …`, uses a scope ADR-0006 does not hold.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
      # The engineering track is left out of the cooldown, as in .npmrc
      # (local/ADR-0026).
      # Dependabot names an aliased dependency by its key in package.json.
      exclude: ["engineering"]
    ignore:
      - dependency-name: "yargs"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@commitlint/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@fission-ai/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    commit-message:
      prefix: chore
  # npm for the documentation site: security updates only (the limit of 0
  # turns version updates off).
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Applies to version updates only, for the day the limit is lifted:
    # Dependabot does not delay security updates.
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
