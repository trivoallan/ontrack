name: Bug report
description: A command, or a page of the documentation, that does not do what it says.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What you ran
      description: The command, and what it printed. For a page of the documentation, its address.
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: The output of `npx ontrack --version`.
