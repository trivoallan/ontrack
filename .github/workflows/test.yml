name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commits check (ADR-0006) reads the history since origin/HEAD.
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The tests run the sources; this is the check of what an install ships.
      - run: node dist/bin/ontrack.js --help
      # The repository's own governance: fails when the installed source asks
      # a question this repository has not imported or ruled again. It bites
      # on the pull request that updates the source; source-updates.yml is
      # what notices that an update exists.
      - run: node dist/bin/ontrack.js plan
      # The secrets check (ADR-0015) runs gitleaks, a Go binary outside npm:
      # pinned by version and checksum (ADR-0011).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # And fails when a decided ADR's check does.
      # On a pull request, the branch check (ADR-0009) reads GITHUB_HEAD_REF;
      # the changes check (ADR-0016) finds openspec in node_modules/.bin.
      - run: node dist/bin/ontrack.js check

  # The lowest supported Node (engines in package.json).
  node-22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm test
