name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commits check (ADR-0006) reads the history since origin/HEAD.
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Dependencies are installed with npm 12 (ADR-0020,
      # install_scripts: ignored): it runs no dependency's install script
      # unless package.json names it. Node 24 ships npm 11, which runs them.
      # ponytail: the version is written in each workflow that installs, and
      # nothing updates it. Drop these steps once the Node in .nvmrc ships
      # npm 12.
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The tests run the sources; this is the check of what an install ships.
      - run: node dist/bin/ontrack.js --help
      # The repository's own governance: fails when the installed source asks
      # a question this repository has not imported or ruled again. It bites
      # on the pull request that updates the source; source-updates.yml is
      # what notices that an update exists.
      - run: node dist/bin/ontrack.js plan
      # The secrets check (ADR-0015) runs gitleaks, a Go binary outside npm.
      # Its version and checksum are pinned in the script (ADR-0011), which
      # the apply sessions run too.
      - name: Install gitleaks
        run: |
          scripts/install-gitleaks.sh "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # And fails when a decided ADR's check does.
      # On a pull request, the branch check (ADR-0009) reads GITHUB_HEAD_REF;
      # the changes check (ADR-0016) finds openspec in node_modules/.bin.
      # release-please names its own branch, which no prefix of ADR-0009 fits:
      # without GITHUB_HEAD_REF the branch check finds a detached checkout and
      # has nothing to check. Every other check still runs on the release.
      - run: |
          case "$GITHUB_HEAD_REF" in release-please--*) unset GITHUB_HEAD_REF ;; esac
          node dist/bin/ontrack.js check

  # The lowest supported Node (engines in package.json).
  node-22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm test
