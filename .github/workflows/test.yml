name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The tests run the sources; this is the check of what an install ships.
      - run: node dist/bin/ontrack.js --help
      # The repository's own governance: fails when a decided ADR's check does.
      - run: node dist/bin/ontrack.js check

  # The lowest supported Node (engines in package.json).
  node-22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm test
