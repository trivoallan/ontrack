name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commits check (ADR-0006) reads the history since origin/HEAD.
          fetch-depth: 0
      - run: git remote set-head origin --auto
      # mise installs Node, and the two binaries outside npm that `check`
      # runs (gitleaks for ADR-0015, zizmor for ADR-0011), at the versions
      # mise.toml pins, checked against mise.lock (ADR-0025; the action
      # passes --locked when the lockfile is there), and puts them on the
      # PATH. mise's own version is written here and nothing updates it:
      # keep it at mise.toml's min_version. setup-node, given no version,
      # restores the npm cache.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
      # Dependencies are installed with npm 12 (ADR-0020,
      # install_scripts: ignored): it runs no dependency's install script
      # unless package.json names it. Node 24 ships npm 11, which runs them.
      # ponytail: the version is written in each workflow that installs, and
      # nothing updates it. Drop these steps once the Node in mise.toml ships
      # npm 12.
      - run: npm install --global npm@12.2.2 # zizmor: ignore[adhoc-packages] npm itself, exact version, no lockfile can hold it
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The tests run the sources; this is the check of what an install ships.
      - run: node dist/bin/ontrack.js --help
      # The repository's own governance: fails when the installed track asks
      # a convention this repository has not imported or ruled again. It bites
      # on the pull request that updates the track; track-updates.yml is
      # what notices that an update exists.
      - run: node dist/bin/ontrack.js plan
      # And fails when a decided ADR's check does.
      # On a pull request, the branch check (ADR-0009) reads GITHUB_HEAD_REF;
      # the changes check (ADR-0016) finds openspec in node_modules/.bin.
      # release-please's own branch passes it: ADR-0012 rules release-please.
      # The review check (ADR-0022) reads the default branch's rules through
      # `gh api`; the job's read-only token is enough.
      - run: node dist/bin/ontrack.js check
        env:
          GH_TOKEN: ${{ github.token }}

  # The lowest supported Node (engines in package.json).
  node-22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm test
