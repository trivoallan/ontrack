name: track-updates

# `ontrack plan` reads the track as installed: it cannot see a question
# revised upstream until the dependency is updated. This job updates it in a
# throwaway checkout, once a week, and fails when `plan` then has something
# to report. The failure is the notice: someone updates the track for real,
# then runs `apply` and `review`.
#
# ponytail: a failed run is the only trace, and it repeats each week until
# the track is updated. Open a pull request with the lockfile change if the
# notice needs to carry the work.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node at the version mise.toml pins, checked against mise.lock
      # (ADR-0025); setup-node, given no version, restores the npm cache.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
      # npm 12, which runs no dependency's install script: see test.yml.
      - run: npm install --global npm@12.2.2 # zizmor: ignore[adhoc-packages] npm itself, exact version, no lockfile can hold it
      # Installing builds ontrack (the `prepare` script).
      - run: npm ci
      # The alias of each track this repository imports.
      - run: npm update engineering
      # Exits with 2, and fails the job, when an ADR is new or revised.
      - run: node dist/bin/ontrack.js plan
