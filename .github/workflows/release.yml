name: release

# Keeps a release pull request open; merging it tags vX.Y.Z and creates the
# GitHub release, then publishes that version to the npm registry: the two
# environments of ADR-0012, both on tag. Configuration:
# release-please-config.json.
on:
  push:
    branches: [main]

# Each job asks for what it needs, and nothing is granted by default.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # To push the release branch, open its pull request, tag and release.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request opened with the default GITHUB_TOKEN triggers no
          # workflow, so its required checks would never run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Runs only on the push that merged the release pull request: the commit
  # checked out is the one release-please just tagged.
  publish:
    needs: release-please
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the job proves to the registry, by OIDC, that
      # it is this workflow in this repository. No token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node at the version mise.toml pins (ADR-0025). Trusted publishing
      # needs npm 11.5.1 or later; Node 24 ships it.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.8
          install_args: node
          # No cache in a job that publishes: see setup-node below.
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: https://registry.npmjs.org
          # No cache in a job that publishes: nothing restored from an earlier
          # run ends up in the package.
          package-manager-cache: false
      # npm 12, which runs no dependency's install script: see test.yml.
      - run: npm install --global npm@12.2.2 # zizmor: ignore[adhoc-packages] npm itself, exact version, no lockfile can hold it
      # `prepare` builds dist/, which is what the package ships.
      - run: npm ci
      # Build provenance (ADR-0021, level 2). Trusted publishing is meant to
      # attach it on its own; the flag says so, and is what the ADR's check
      # looks for.
      - run: npm publish --provenance

  # The SBOM of the release (ADR-0019, sbom cyclonedx): what this version
  # contains, written when it is released and attached to the GitHub release.
  # A job of its own: it writes to the release, so it installs nothing and
  # runs no package code, and the job that publishes keeps `contents: read`.
  sbom:
    needs: release-please
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      # To attach the file to the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Syft reads the lockfile of the tagged commit. What it lists is set in
      # .syft.yaml: ontrack and the dependencies it needs to run.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SOURCE_VERSION: ${{ needs.release-please.outputs.version }}
        with:
          path: .
          config: .syft.yaml
          format: cyclonedx-json
          output-file: sbom.cdx.json
          # The file goes to the release, by the step below: the action
          # attaches it on its own only when a release event triggers it.
          upload-artifact: false
          upload-release-assets: false
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          file="ontrack-${TAG}.cdx.json"
          mv sbom.cdx.json "$file"
          gh release upload "$TAG" "$file"
