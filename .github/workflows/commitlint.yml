name: commitlint

# Pull requests are squash-merged: the title is the commit that lands on main.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node at the version mise.toml pins, checked against mise.lock
      # (ADR-0025); setup-node, given no version, restores the npm cache.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
      # npm 12, which runs no dependency's install script: see test.yml.
      - run: npm install --global npm@12.2.2 # zizmor: ignore[adhoc-packages] npm itself, exact version, no lockfile can hold it
      # --ignore-scripts skips `prepare`: linting a title needs no build.
      - run: npm ci --ignore-scripts
      # Through the environment: a title interpolated into the script could inject shell.
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | npx commitlint
